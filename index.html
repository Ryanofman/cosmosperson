<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
        content="Cosmos Person Photography - Premium astrophotography portfolio showcasing deep sky objects, nebulae, and galaxies">
    <meta name="keywords" content="astrophotography, deep sky, nebula, galaxy, cosmos, space photography, portfolio">
    <meta name="author" content="Cosmos Person">

    <title>Cosmos Person Photography | Astrophotography Portfolio</title>

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="manifest" href="manifest.json">

    <!-- Open Graph -->
    <meta property="og:title" content="Cosmos Person Photography">
    <meta property="og:description"
        content="Premium astrophotography portfolio - Deep sky objects captured through my lens">
    <meta property="og:image" content="preview.jpg">
    <meta property="og:url" content="https://YOUR_USERNAME.github.io/YOUR_REPO_NAME/">

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700&family=Space+Grotesk:wght@300;400;500;600&display=swap"
        rel="stylesheet">

    <!-- Styles -->
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="gallery.css">
</head>

<body class="gallery-page">
    <!-- Animated background -->
    <div class="stars-bg"></div>

    <!-- Header -->
    <header class="gallery-header">
        <div class="header-container">
            <a href="index.html" class="header-logo">
                <span class="logo-text">Cosmos Person</span>
                <span class="logo-tagline">Photography</span>
            </a>
            <nav class="header-nav">
                <a href="explore.html" class="nav-cta">
                    <span>Explore the Universe</span>
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                        stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M5 12h14M12 5l7 7-7 7" />
                    </svg>
                </a>
            </nav>
        </div>
    </header>



    <!-- Gallery Section -->
    <section class="gallery-section" id="gallery">


        <!-- Loading State -->
        <div class="gallery-loading" id="gallery-loading">
            <div class="loading-spinner"></div>
            <p>Loading captures...</p>
        </div>

        <!-- Gallery Carousel -->
        <div class="gallery-carousel-wrapper">
            <button class="carousel-nav prev" aria-label="Previous images">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                    stroke-width="2">
                    <path d="M15 18l-6-6 6-6" />
                </svg>
            </button>
            <div class="gallery-grid" id="gallery-grid"></div>
            <button class="carousel-nav next" aria-label="Next images">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                    stroke-width="2">
                    <path d="M9 18l6-6-6-6" />
                </svg>
            </button>
        </div>
    </section>



    <!-- Lightbox Modal -->
    <div class="lightbox" id="lightbox">
        <div class="lightbox-backdrop"></div>
        <button class="lightbox-close" aria-label="Close">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                stroke-width="2">
                <path d="M18 6L6 18M6 6l12 12" />
            </svg>
        </button>
        <button class="lightbox-nav lightbox-prev" aria-label="Previous">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                stroke-width="2">
                <path d="M15 18l-6-6 6-6" />
            </svg>
        </button>
        <button class="lightbox-nav lightbox-next" aria-label="Next">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                stroke-width="2">
                <path d="M9 18l6-6-6-6" />
            </svg>
        </button>
        <div class="lightbox-content">
            <img id="lightbox-image" src="" alt="">
            <div class="lightbox-info">
                <h2 id="lightbox-title"></h2>
                <span id="lightbox-type"></span>
                <span id="lightbox-counter"></span>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="config.js"></script>
    <script src="celestial-database.js"></script>
    <script src="gallery.js"></script>
</body>

</html>
