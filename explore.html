<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
        content="Explore the Universe — an interactive sky map where every beacon is one of my photos, sitting right where it lives in the sky.">
    <meta name="author" content="Cosmos Person">

    <title>Explore the Universe — Cosmos Person</title>

    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <link rel="manifest" href="manifest.json">

    <!-- Open Graph -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="Explore the Universe — Cosmos Person">
    <meta property="og:description"
        content="An interactive sky map where every beacon is one of my photos. Pan around, switch wavelengths, and find each one where it actually lives.">
    <meta property="og:image" content="https://cosmosperson.com/gallery/_web/california-1600.jpg">
    <meta property="og:url" content="https://cosmosperson.com/explore.html">
    <meta name="twitter:card" content="summary_large_image">

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,400&family=Inter:wght@300;400;500&display=swap"
        rel="stylesheet">

    <!-- Aladin Lite -->
    <link rel="stylesheet" href="https://aladin.cds.unistra.fr/AladinLite/api/v3/latest/aladin.min.css" />

    <link rel="stylesheet" href="site.css">
    <link rel="stylesheet" href="styles.css">
</head>

<body class="explore-page">
    <!-- Header -->
    <header class="site-header">
        <div class="header-inner">
            <a href="index.html" class="wordmark" aria-label="Cosmos Person">C<svg class="cat-o"
                    viewBox="0 0 24 24" aria-hidden="true">
                    <path
                        d="M6.34 7.84 L4.6 1.6 L10.61 5.62 A8 8 0 0 1 13.39 5.62 L19.4 1.6 L17.66 7.84 A8 8 0 1 1 6.34 7.84 Z"
                        fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"
                        stroke-linecap="round" />
                </svg>smos<span>&thinsp;Person</span></a>
            <nav class="site-nav" aria-label="Site">
                <a href="index.html#gallery">Photos</a>
                <a href="explore.html" class="active">Explore<span class="nav-x"> the Universe</span></a>
            </nav>
        </div>
    </header>

    <!-- Loading message -->
    <div class="loading-message" id="loading-message">
        <span class="label">Charting the sky</span>
    </div>

    <!-- Aladin Lite container -->
    <div id="aladin-lite-div"></div>

    <!-- Control panel -->
    <aside class="control-panel" id="control-panel">
        <div class="panel-section">
            <span class="label">Find an Object</span>
            <div class="search-group">
                <input type="text" class="search-input" id="object-search"
                    placeholder="M 31, NGC 7000, Horsehead…">
                <button class="search-button" onclick="searchObject()">Go</button>
            </div>
        </div>

        <div class="panel-section">
            <span class="label">My Photos</span>
            <div class="captures-stats">
                <div class="stat-box">
                    <div class="stat-number" id="capture-count">0</div>
                    <div class="stat-label">Photographed</div>
                </div>
                <div class="stat-box">
                    <div class="stat-number" id="visible-count">0</div>
                    <div class="stat-label">In This View</div>
                </div>
            </div>

            <button class="action-button" onclick="goToRandomPhoto()">Surprise Me</button>
            <button class="action-button secondary" onclick="showAllPhotos()">Show the Whole Sky</button>

            <div class="photo-list" id="photo-list"></div>
        </div>

        <div class="panel-section">
            <span class="label">Wavelength</span>
            <select class="survey-select" id="survey-select" onchange="changeSurvey()">
                <option value="P/DSS2/color">Optical — DSS2 Color</option>
                <option value="P/2MASS/color">Near-Infrared — 2MASS</option>
                <option value="P/allWISE/color">Mid-Infrared — WISE</option>
                <option value="P/SDSS9/color">Deep Survey — SDSS</option>
                <option value="P/GLIMPSE360">Spitzer — GLIMPSE 360</option>
            </select>
        </div>
    </aside>

    <!-- Mobile panel toggle -->
    <button class="btn panel-toggle" id="panel-toggle" aria-expanded="false">My Photos</button>

    <!-- Bottom hints -->
    <div class="bottom-controls">
        <span class="control-hint">Drag to pan</span>
        <span class="control-hint">Scroll to zoom</span>
        <span class="control-hint"><em>Teal beacons</em> are my photos — click one</span>
    </div>

    <!-- Photo viewer modal -->
    <div class="photo-viewer" id="photo-viewer">
        <div class="photo-viewer-backdrop" onclick="closePhotoViewer()"></div>
        <button class="icon-btn close-viewer" onclick="closePhotoViewer()" aria-label="Close">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
                <path d="M18 6L6 18M6 6l12 12" />
            </svg>
        </button>
        <div class="photo-viewer-content">
            <img id="viewer-image" src="" alt="">
            <div class="photo-viewer-info">
                <h2 id="viewer-title"></h2>
                <p class="viewer-meta" id="viewer-meta"></p>
                <p class="viewer-description" id="viewer-description"></p>
                <div class="viewer-actions" id="viewer-actions"></div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://aladin.cds.unistra.fr/AladinLite/api/v3/latest/aladin.js"></script>
    <script src="config.js"></script>
    <script src="celestial-database.js"></script>
    <script src="app.js"></script>
</body>

</html>
